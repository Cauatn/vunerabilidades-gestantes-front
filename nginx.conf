server {
  listen 3000;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy da API para o serviço de backend (rede do docker-compose).
  # Usa o DNS embutido do Docker via variável para que o nginx suba
  # mesmo quando o backend ainda não está disponível.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $upstream http://backend:3000;
    proxy_pass $upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
